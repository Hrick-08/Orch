<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatGPT Mock Page</title>
  </head>
  <body>
    <nav>
      <a href="/" data-testid="new-chat-button">New chat</a>
      <div data-testid="profile-button">User Account</div>
    </nav>
    <main>
      <div id="conversation">
        <div data-message-author-role="user">Hello ChatGPT</div>
        <div data-message-author-role="assistant">Hello! How can I assist you today?</div>
      </div>
      <form>
        <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
        <button data-testid="send-button" type="button" aria-label="Send prompt">Send</button>
      </form>
    </main>
  </body>
</html>
